GROUP=sk.ainet.vendors
VERSION_NAME=0.1.0
POM_DESCRIPTION=Vendor-specific SKaiNET compiler plugins (hardware target optimizers)

POM_URL=https://github.com/SKaiNET-developers/SKaiNET-embedded-vendors/
POM_SCM_URL=https://github.com/SKaiNET-developers/SKaiNET-embedded-vendors
POM_SCM_CONNECTION=scm:git:git@github.com:SKaiNET-developers/SKaiNET-embedded-vendors.git
POM_SCM_DEV_CONNECTION=scm:git:ssh@github.com:SKaiNET-developers/SKaiNET-embedded-vendors.git

POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://mit-license.org/
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=SKaiNET-developers
POM_DEVELOPER_NAME=SKaiNET development team
POM_DEVELOPER_URL=https://github.com/SKaiNET-developers/

mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
signAllPublications=true

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.parallel=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.stability.nowarn=true

SONATYPE_HOST=DEFAULT
SONATYPE_AUTOMATIC_RELEASE=false
RELEASE_SIGNING_ENABLED=true
